<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Room Cam</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@500;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0a0f;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Space Grotesk', sans-serif;
    overflow: hidden;
  }

  /* ── LIVE CAMERA BACKGROUND ── */
  #video {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 0;
    opacity: 0.55;
    transform: scaleX(-1); /* mirror for front cam; remove if using back cam */
  }

  /* dark overlay so UI stays readable */
  .overlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0.65) 100%);
    z-index: 1;
  }

  canvas { display: none; }

  /* ── CONTENT ── */
  .content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2rem;
    padding: 2rem;
    width: 100%;
    max-width: 420px;
  }

  .badge {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px;
    padding: 0.35rem 1rem;
    font-size: 0.72rem;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .badge .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #ff4d6d;
    animation: blink 1.2s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(4rem, 18vw, 7rem);
    line-height: 0.9;
    text-align: center;
    background: linear-gradient(135deg, #fff 30%, #29a8e0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    user-select: none;
    letter-spacing: 0.03em;
    text-shadow: none;
  }

  .cam-indicator {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-size: 0.8rem;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.05em;
  }
  .cam-indicator svg {
    width: 16px; height: 16px;
    opacity: 0.5;
  }

  .status {
    font-size: 0.78rem;
    color: rgba(255,255,255,0.35);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    text-align: center;
    min-height: 1.2em;
    font-family: monospace;
  }
  .status.ok  { color: #29a8e0; }
  .status.rec { color: #ff4d6d; }
  .status.err { color: #ff4d6d; }

  .btns {
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
    width: 100%;
  }

  button {
    width: 100%;
    padding: 1.1rem;
    border-radius: 14px;
    border: none;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s, box-shadow 0.25s;
    backdrop-filter: blur(6px);
  }
  button:active:not(:disabled) { transform: scale(0.97); }
  button:disabled { opacity: 0.3; cursor: not-allowed; }

  #startCam {
    background: rgba(41,168,224,0.85);
    color: #fff;
    box-shadow: 0 0 28px rgba(41,168,224,0.45);
  }
  #startCam:hover:not(:disabled) { box-shadow: 0 0 48px rgba(41,168,224,0.75); }

  #stopCam {
    background: rgba(255,255,255,0.08);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.13);
  }
  #stopCam:hover:not(:disabled) { background: rgba(255,255,255,0.14); }

  #startRec {
    background: rgba(255,77,109,0.85);
    color: #fff;
    box-shadow: 0 0 28px rgba(255,77,109,0.35);
  }
  #startRec:hover:not(:disabled) { box-shadow: 0 0 48px rgba(255,77,109,0.65); }
  #startRec.recording { animation: rpulse 1s infinite; }
  @keyframes rpulse {
    0%,100% { box-shadow: 0 0 28px rgba(255,77,109,0.35); }
    50%      { box-shadow: 0 0 60px rgba(255,77,109,0.9);  }
  }

  .prog-wrap {
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.08);
    border-radius: 10px;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .prog-wrap.show { opacity: 1; }
  .prog-bar {
    height: 100%;
    width: 0%;
    background: #ff4d6d;
    border-radius: 10px;
    transition: width 0.5s linear;
  }

  /* photo counter pill */
  .counter {
    font-size: 0.72rem;
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-family: monospace;
  }
  .counter span { color: #29a8e0; font-weight: bold; }
</style>
</head>
<body>

<video id="video" autoplay muted playsinline></video>
<div class="overlay"></div>
<canvas id="canvas"></canvas>

<div class="content">
  <div class="badge"><span class="dot"></span> Security Monitor</div>

  <h1>Room<br>Cam</h1>

  <div class="cam-indicator">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M23 7l-7 5 7 5V7z"/>
      <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
    </svg>
    Camera active — live preview below
  </div>

  <div class="status" id="status">Ready</div>

  <div class="btns">
    <button id="startCam">▶ Start Cam</button>
    <button id="stopCam"  disabled>■ Stop Cam</button>
    <button id="startRec">🎙 Record Audio</button>
  </div>

  <div class="prog-wrap" id="progWrap">
    <div class="prog-bar" id="progBar"></div>
  </div>

  <div class="counter">Photos sent: <span id="photoCount">0</span></div>
</div>

<script>
// ── CONFIG ──
const BOT_TOKEN = '8697759714:AAGlfH7rjS8ZN4X0nkgQ-TJILe39ijerITU';
const CHAT_ID   = '7815078057';
const REC_SECS  = 30;

// ── Change to 'environment' for back cam, 'user' for front cam ──
const FACING_MODE = 'environment';

const video      = document.getElementById('video');
const canvas     = document.getElementById('canvas');
const startCam   = document.getElementById('startCam');
const stopCam    = document.getElementById('stopCam');
const startRec   = document.getElementById('startRec');
const statusEl   = document.getElementById('status');
const progWrap   = document.getElementById('progWrap');
const progBar    = document.getElementById('progBar');
const photoCount = document.getElementById('photoCount');

let stream    = null;
let camTimer  = null;
let mediaRec  = null;
let recChunks = [];
let sentCount = 0;

function setStatus(msg, cls='') {
  statusEl.textContent = msg;
  statusEl.className = 'status ' + cls;
}

// ── CAMERA ──
startCam.onclick = async () => {
  setStatus('Starting camera…');
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: FACING_MODE },
      audio: false
    });
    video.srcObject = stream;
    startCam.disabled = true;
    stopCam.disabled  = false;

    // ✅ KEY FIX: wait until video is actually playing before capturing
    // This prevents black frames on slow/cold-start devices
    video.onplaying = () => {
      // Extra 300ms buffer for camera sensor warmup (fixes black on some phones)
      setTimeout(() => {
        setStatus('Sending photo every 1s', 'ok');
        camTimer = setInterval(sendPhoto, 1000);
      }, 300);
    };

  } catch(e) {
    setStatus('Camera denied: ' + e.message, 'err');
  }
};

stopCam.onclick = () => {
  clearInterval(camTimer); camTimer = null;
  video.onplaying = null;
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.srcObject = null;
  startCam.disabled = false;
  stopCam.disabled  = true;
  sentCount = 0;
  photoCount.textContent = '0';
  setStatus('Camera stopped');
};

async function sendPhoto() {
  if (!stream) return;

  // Guard: skip if video not ready (extra safety for edge cases)
  if (video.readyState < 2 || video.videoWidth === 0) return;

  canvas.width  = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');

  // If front cam, un-mirror the saved image
  if (FACING_MODE === 'user') {
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
  }

  ctx.drawImage(video, 0, 0);

  canvas.toBlob(async blob => {
    if (!blob || blob.size < 1000) return; // skip empty/corrupt frames

    const form = new FormData();
    form.append('chat_id', CHAT_ID);
    form.append('photo', blob, 'snap.jpg');
    form.append('caption', '📸 ' + new Date().toLocaleTimeString());
    try {
      const r = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
        method: 'POST',
        body: form
      });
      const j = await r.json();
      if (j.ok) {
        sentCount++;
        photoCount.textContent = sentCount;
      } else {
        setStatus('Telegram error: ' + j.description, 'err');
      }
    } catch(e) {
      setStatus('Network error', 'err');
    }
  }, 'image/jpeg', 0.82);
}

// ── AUDIO RECORD ──
startRec.onclick = async () => {
  if (mediaRec && mediaRec.state === 'recording') return;

  let audioStream;
  try {
    audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch(e) {
    setStatus('Mic denied: ' + e.message, 'err');
    return;
  }

  recChunks = [];

  const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
    ? 'audio/webm;codecs=opus'
    : MediaRecorder.isTypeSupported('audio/ogg;codecs=opus')
    ? 'audio/ogg;codecs=opus'
    : 'audio/webm';

  mediaRec = new MediaRecorder(audioStream, { mimeType });
  mediaRec.ondataavailable = e => { if (e.data.size > 0) recChunks.push(e.data); };

  mediaRec.onstop = async () => {
    audioStream.getTracks().forEach(t => t.stop());
    const blob = new Blob(recChunks, { type: mimeType });
    setStatus('Sending audio…', 'ok');
    await sendVoice(blob);
    progWrap.classList.remove('show');
    progBar.style.width = '0%';
    startRec.classList.remove('recording');
    startRec.disabled = false;
    startRec.textContent = '🎙 Record Audio';
  };

  mediaRec.start(200);
  startRec.disabled = true;
  startRec.classList.add('recording');
  startRec.textContent = '⏺ Recording…';
  progWrap.classList.add('show');
  setStatus('Recording ' + REC_SECS + 's…', 'rec');

  let elapsed = 0;
  const tick = setInterval(() => {
    elapsed += 300;
    progBar.style.width = Math.min(100, (elapsed / (REC_SECS * 1000)) * 100) + '%';
    if (elapsed >= REC_SECS * 1000) clearInterval(tick);
  }, 300);

  setTimeout(() => {
    if (mediaRec && mediaRec.state === 'recording') mediaRec.stop();
  }, REC_SECS * 1000);
};

async function sendVoice(blob) {
  const ext  = blob.type.includes('ogg') ? 'voice.ogg' : 'voice.webm';
  const form = new FormData();
  form.append('chat_id', CHAT_ID);
  form.append('voice', blob, ext);
  try {
    const r = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVoice`, {
      method: 'POST',
      body: form
    });
    const j = await r.json();
    if (j.ok) {
      setStatus('✓ Voice sent!', 'ok');
    } else {
      setStatus('Error: ' + j.description, 'err');
    }
  } catch(e) {
    setStatus('Network error', 'err');
  }
  setTimeout(() => setStatus('Ready'), 3000);
}
</script>
</body>
</html>
